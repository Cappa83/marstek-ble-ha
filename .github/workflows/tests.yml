name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: python -m json.tool custom_components/marstek_ct/manifest.json >/dev/null && python -m json.tool custom_components/marstek_ct/translations/en.json >/dev/null && python -m json.tool custom_components/marstek_ct/translations/de.json >/dev/null && python -m json.tool hacs.json >/dev/null
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run protocol tests
        run: pytest -q tests
