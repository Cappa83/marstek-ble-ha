name: Publish 0.2.1b1 prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifest version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/marstek_ct/manifest.json").read_text()
          )
          assert manifest["version"] == "0.2.1b1", manifest["version"]
          print("manifest version:", manifest["version"])
          PY

      - name: Run regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          pytest -q

      - name: Create GitHub prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1b1 >/dev/null 2>&1; then
            echo "v0.2.1b1 already exists; nothing to publish."
            exit 0
          fi
          gh release create v0.2.1b1 \
            --target "$GITHUB_SHA" \
            --title "Marstek BLE 0.2.1b1" \
            --notes-file RELEASE_NOTES_0.2.1b1.md \
            --prerelease
