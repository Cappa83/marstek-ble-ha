name: Publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - custom_components/marstek_ct/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Read and verify manifest version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/marstek_ct/manifest.json").read_text()
          )
          version = str(manifest["version"]).strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", version):
              raise SystemExit(f"Unsupported version format: {version}")

          with open(Path.cwd() / Path("version.out"), "w") as out:
              out.write(version)
          print("version:", version)
          PY
          echo "version=$(cat version.out)" >> "$GITHUB_OUTPUT"
          rm version.out

      - name: Compile and validate JSON
        run: |
          python3 -m compileall -q custom_components tests
          python3 -m json.tool custom_components/marstek_ct/manifest.json >/dev/null
          python3 -m json.tool custom_components/marstek_ct/translations/en.json >/dev/null
          python3 -m json.tool custom_components/marstek_ct/translations/de.json >/dev/null
          python3 -m json.tool hacs.json >/dev/null

      - name: Run regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          pytest -q tests

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi

          EXTRA=()
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            EXTRA+=(--prerelease)
          fi

          NOTES=()
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES+=(--notes-file "$NOTES_FILE")
          else
            NOTES+=(--generate-notes)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Marstek BLE ${VERSION}" \
            "${NOTES[@]}" \
            "${EXTRA[@]}"
